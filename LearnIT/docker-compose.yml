# Local development stack: app + SQL Server in containers.
# Copy .env.example to .env and fill it in before running:
#   docker compose up --build
#
# NOTE: this file is for LOCAL use only. Azure Container Instances no longer
# supports `docker compose up` (the Docker/ACI cloud integration was retired),
# so the cloud deployment goes through azure-pipelines.yml / deploy/deploy-aci.sh.

name: learnit

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: learnit_sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - learnit-net
    restart: unless-stopped

  app:
    image: ${IMAGE_NAME:-learnit}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnit_app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # Development enables Swagger UI and the Bogus DBSeeder.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      LearnITDbConnectionString: "Server=sqlserver,1433;Database=LearnIT;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      # Public URLs the server hands back to clients (logo URLs, e-mail links).
      BaseServerAddress: "http://localhost:${APP_PORT:-5000}"
      EmailConfirmationControllerAddress: "http://localhost:${APP_PORT:-5000}/email"
      HomeFrontedPageAddress: "http://localhost:${APP_PORT:-5000}/"
      # Nested configuration keys use "__" as the section separator.
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set in .env}
      Jwt__Issuer: ${JWT_ISSUER:-LearnITServer}
      Jwt__Audience: ${JWT_AUDIENCE:-LearnITServer}
      SmtpClientSettings__Host: ${SMTP_HOST:-smtp.gmail.com}
      SmtpClientSettings__Port: ${SMTP_PORT:-587}
      SmtpClientSettings__UserName: ${SMTP_USERNAME:-}
      SmtpClientSettings__Password: ${SMTP_PASSWORD:-}
      SenderEmail: ${SENDER_EMAIL:-}
    ports:
      - "${APP_PORT:-5000}:8080"
    networks:
      - learnit-net
    restart: unless-stopped

volumes:
  sql_data:

networks:
  learnit-net:
